<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GLOWPOLE Calculator</title>

<!-- Google Font: Space Grotesk for a modern, techy-but-premium feel -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     ROOT / RESET
     ============================================================ */
  :root{
    --bg-1:#0b0d12;
    --bg-2:#141821;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.12);
    --accent:#7c5cff;
    --accent-2:#37e6c4;
    --text-hi:#f2f3f7;
    --text-lo:#8a8fa3;
    --danger:#ff3b5c;
    --op-btn:rgba(124,92,255,0.18);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(124,92,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(55,230,196,0.10), transparent 45%),
      var(--bg-1);
    font-family:'Space Grotesk', sans-serif;
    color:var(--text-hi);
    overflow-x:hidden;
  }

  /* Prevent text selection / callout on the header (needed for long-press secret) */
  .no-select{
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  /* ============================================================
     PAGE LAYOUT — header / center stage / footer
     ============================================================ */
  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: clamp(16px, 4vw, 40px) 16px;
  }

  header.brand{
    width:100%;
    text-align:center;
    padding-top: clamp(4px, 2vh, 20px);
  }

  header.brand h1{
    margin:0;
    font-weight:700;
    letter-spacing:0.12em;
    font-size: clamp(1.4rem, 3.4vw, 2.4rem);
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    cursor:default;
  }

  main.stage{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(12px, 4vh, 32px) 0;
  }

  footer.credit{
    width:100%;
    text-align:center;
    font-size: clamp(0.7rem, 1.6vw, 0.85rem);
    color:var(--text-lo);
    letter-spacing:0.03em;
    padding-bottom: clamp(4px, 1vh, 10px);
  }

  /* ============================================================
     CALCULATOR CARD
     ============================================================ */
  .calculator{
    width:100%;
    max-width: 380px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius: 28px;
    padding: clamp(16px, 4vw, 26px);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .display{
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding: clamp(18px, 5vw, 26px) clamp(14px, 4vw, 20px);
    margin-bottom: clamp(14px, 3vw, 20px);
    text-align:right;
    min-height: clamp(64px, 12vw, 84px);
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    overflow:hidden;
  }

  .display span{
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight:600;
    color:var(--text-hi);
    word-break:break-all;
    white-space:nowrap;
    overflow-x:auto;
    max-width:100%;
  }

  .keys{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2vw, 12px);
  }

  .key{
    border:none;
    outline:none;
    border-radius:16px;
    padding: clamp(14px, 4vw, 20px) 0;
    font-family:inherit;
    font-size: clamp(1rem, 3.2vw, 1.25rem);
    font-weight:600;
    color:var(--text-hi);
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.06);
    cursor:pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }

  .key:active{ transform:scale(0.94); }

  .key.op{
    background:var(--op-btn);
    color:var(--accent-2);
  }

  .key.clear{
    background:rgba(255,59,92,0.14);
    color:var(--danger);
  }

  .key.equals{
    grid-column: span 2;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#0b0d12;
  }

  .key.zero{
    grid-column: span 2;
  }

  /* ============================================================
     PRANK OVERLAY — subscription popup
     ============================================================ */
  .overlay{
    position:fixed;
    inset:0;
    display:none;               /* toggled via JS */
    align-items:center;
    justify-content:center;
    background:rgba(4,5,8,0.78);
    backdrop-filter: blur(6px);
    z-index:999;
    padding:16px;
  }

  .overlay.active{ display:flex; }

  .popup{
    position:relative;
    width:100%;
    max-width: 420px;
    background:linear-gradient(160deg, #1b1f2b, #11141c);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:24px;
    padding: clamp(24px, 6vw, 36px);
    text-align:center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    animation: pop-in 0.25s ease;
  }

  @keyframes pop-in{
    from{ transform:scale(0.9); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .popup .close-x{
    position:absolute;
    top:14px;
    right:14px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.08);
    color:var(--text-hi);
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .popup .icon{
    font-size:2.4rem;
    margin-bottom:10px;
  }

  .popup h2{
    margin:0 0 12px;
    font-size: clamp(1.2rem, 4vw, 1.5rem);
    color:var(--text-hi);
  }

  .popup p.msg{
    margin:0 0 22px;
    color:var(--text-lo);
    font-size: clamp(0.9rem, 3vw, 1rem);
    line-height:1.5;
  }

  .popup .price{
    color:var(--accent-2);
    font-weight:700;
  }

  .popup .fake-cta{
    display:inline-block;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    color:#0b0d12;
    font-weight:700;
    padding:12px 28px;
    border-radius:14px;
    font-size:0.95rem;
  }

  /* Panic mode blinking red error text */
  .panic-text{
    display:none;
    margin-top:18px;
    color:var(--danger);
    font-weight:700;
    font-size: clamp(0.85rem, 3vw, 1rem);
    letter-spacing:0.02em;
    animation: blink-red 0.6s steps(1) infinite;
  }

  .panic-text.active{ display:block; }

  @keyframes blink-red{
    50%{ opacity:0.15; }
  }

  /* subtle shake once panic mode kicks in, purely decorative / clearly "joke" energy */
  .popup.panic{
    animation: shake 0.4s ease-in-out infinite;
  }

  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px) rotate(-0.3deg); }
    75%{ transform:translateX(4px) rotate(0.3deg); }
  }

  /* ============================================================
     RESPONSIVE TWEAKS
     ============================================================ */
  @media (min-width: 900px){
    .calculator{ max-width:420px; }
  }

  @media (max-width: 340px){
    .keys{ gap:6px; }
    .key{ padding:12px 0; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ============================================================
       HEADER — long-press "GLOWPOLE" for 5s = developer bypass
       ============================================================ -->
  <header class="brand">
    <h1 id="brandTitle" class="no-select">GLOWPOLE</h1>
  </header>

  <!-- ============================================================
       CALCULATOR
       ============================================================ -->
  <main class="stage">
    <div class="calculator">
      <div class="display">
        <span id="displayText">0</span>
      </div>

      <div class="keys">
        <button class="key clear" data-action="clear">C</button>
        <button class="key op" data-value="/">÷</button>
        <button class="key op" data-value="*">×</button>
        <button class="key op" data-value="-">−</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key op" data-value="+">+</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key equals" data-action="equals" style="grid-column: span 1;">=</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key" data-value="0" style="grid-row: span 1;">0</button>
      </div>
    </div>
  </main>

  <footer class="credit no-select">Designed by AmaanAjmal</footer>
</div>

<!-- ============================================================
     PRANK OVERLAY (hidden by default)
     ============================================================ -->
<div class="overlay" id="overlay">
  <div class="popup" id="popup">
    <button class="close-x" id="closeBtn" aria-label="Close">✕</button>
    <div class="icon">💳</div>
    <h2>Calculator Pro - Premium Required</h2>
    <p class="msg">
      To calculate complex equations &amp; view results, subscribe to Pro Plan at
      <span class="price">₹499/month</span>.
    </p>
    <div class="fake-cta">Subscribe Now</div>
    <p class="panic-text" id="panicText">ERROR 404: System Memory Overloaded! Device Temp Rising!</p>
  </div>
</div>

<script>
/* =====================================================================
   CALCULATOR + PRANK TRAP LOGIC
   Everything is namespaced/commented so timings & behaviour are easy
   to tweak later.
   ===================================================================== */

// ---- DOM refs ---------------------------------------------------------
const displayText   = document.getElementById('displayText');
const keys           = document.querySelectorAll('.key');
const overlay         = document.getElementById('overlay');
const popup           = document.getElementById('popup');
const closeBtn         = document.getElementById('closeBtn');
const panicText         = document.getElementById('panicText');
const brandTitle         = document.getElementById('brandTitle');

// ---- Calculator state ---------------------------------------------------
let currentInput = '0';   // what's shown on the display

// ---- Prank trap state ----------------------------------------------------
let trapArmed   = false;   // becomes true the first time "=" is pressed
let panicTimer  = null;    // setTimeout handle for the 5s panic escalation
let panicActive = false;   // true once vibration/red-text has fired

// =====================================================================
// BASIC CALCULATOR DISPLAY LOGIC (feels like a real calculator)
// =====================================================================
function updateDisplay(){
  displayText.textContent = currentInput;
}

function appendValue(value){
  if (currentInput === '0' && value !== '.') {
    currentInput = value;
  } else {
    currentInput += value;
  }
  updateDisplay();
}

function clearCalculator(){
  currentInput = '0';
  updateDisplay();
}

// =====================================================================
// PRANK OVERLAY CONTROL
// =====================================================================

// Show the subscription popup (re-showing it is exactly the same call,
// which is what creates the "loop" behaviour).
function showTrap(){
  overlay.classList.add('active');

  // Only start the 5s panic-mode countdown the FIRST time the trap
  // is triggered per "cycle" (cycle = between successful bypasses).
  if (!trapArmed) {
    trapArmed = true;
    startPanicCountdown();
  } else if (panicActive) {
    // If panic mode already fired earlier in this cycle, re-apply
    // its visuals immediately when the popup reappears.
    applyPanicVisuals();
  }
}

function hideTrap(){
  overlay.classList.remove('active');
  // NOTE: we intentionally do NOT reset trapArmed/panicActive here —
  // that's what makes any further button press instantly re-trigger
  // the exact same popup (the "loop").
}

// ---- Panic mode: fires 5s after the popup FIRST appears ----------------
function startPanicCountdown(){
  clearTimeout(panicTimer);
  panicTimer = setTimeout(() => {
    panicActive = true;
    applyPanicVisuals();
  }, 5000); // <-- change this number to adjust panic delay (ms)
}

function applyPanicVisuals(){
  // Blinking red error text
  panicText.classList.add('active');
  popup.classList.add('panic');

  // Haptic pulse pattern — vibrate/pause/vibrate/pause/long-vibrate (ms)
  if (navigator.vibrate) {
    navigator.vibrate([500, 200, 500, 200, 1000]); // <-- tweak pattern here
  }
}

function clearPanicVisuals(){
  panicText.classList.remove('active');
  popup.classList.remove('panic');
  if (navigator.vibrate) navigator.vibrate(0); // stop any ongoing vibration
  clearTimeout(panicTimer);
}

// =====================================================================
// BUTTON WIRING
// =====================================================================
keys.forEach(key => {
  key.addEventListener('click', () => {

    // --- THE LOOP ---
    // Once the trap has been triggered at least once in this cycle,
    // ANY button press (numbers, operators, clear, equals) instantly
    // re-shows the popup instead of doing normal calculator things.
    if (trapArmed) {
      showTrap();
      return;
    }

    const action = key.dataset.action;
    const value  = key.dataset.value;

    if (action === 'clear') {
      clearCalculator();
      return;
    }

    if (action === 'equals') {
      // THE TRAP TRIGGER — never show a real result.
      showTrap();
      return;
    }

    // Normal number / operator input
    if (value !== undefined) {
      appendValue(value);
    }
  });
});

// Close (X) button — closes the popup but does NOT reset trap state,
// so the loop re-engages on the next press of anything.
closeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  hideTrap();
});

// =====================================================================
// SECRET DEVELOPER BYPASS
// Long-press (mouse or touch) "GLOWPOLE" for 5s continuously = full reset.
// Invisible to normal users: no progress bar, no styling change.
// =====================================================================
let bypassTimer = null;

function startBypassHold(e){
  // Prevent text selection / callout while holding on mobile.
  if (e.cancelable) e.preventDefault();

  clearTimeout(bypassTimer);
  bypassTimer = setTimeout(() => {
    performFullReset();
  }, 5000); // <-- change this number to adjust required hold duration (ms)
}

function cancelBypassHold(){
  clearTimeout(bypassTimer);
}

function performFullReset(){
  // 1. Hide popup + red error text
  hideTrap();
  clearPanicVisuals();

  // 2. Reset all trap state so the calculator behaves normally again
  trapArmed   = false;
  panicActive = false;

  // 3. Reset calculator display
  clearCalculator();
}

// Mouse (desktop) — press and hold
brandTitle.addEventListener('mousedown', startBypassHold);
brandTitle.addEventListener('mouseup', cancelBypassHold);
brandTitle.addEventListener('mouseleave', cancelBypassHold);

// Touch (mobile) — press and hold
brandTitle.addEventListener('touchstart', startBypassHold, { passive:false });
brandTitle.addEventListener('touchend', cancelBypassHold);
brandTitle.addEventListener('touchcancel', cancelBypassHold);

// Initial paint
updateDisplay();
</script>

</body>
</html>
